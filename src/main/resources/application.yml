server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/v1
spring:
  application:
    name: society-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mysociety?currentSchema=mysociety}
    username: ${DATABASE_USERNAME:mysociety}
    password: ${DATABASE_PASSWORD:mysociety}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_schema: mysociety
      hibernate.jdbc.time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:mysociety-identity}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
app:
  security:
    jwt-secret: ${JWT_SECRET:8fK9xP2mQ7vL1zN4rT6yU0aS3dH5jW8c}
    issuer: ${JWT_ISSUER:mysociety-identity}
springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /swagger-ui.html
